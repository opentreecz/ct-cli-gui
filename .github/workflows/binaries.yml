name: Build standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            ffmpeg_url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            ffmpeg_bin: ffmpeg
            artifact_suffix: linux-amd64
          - os: ubuntu-22.04-arm
            arch: arm64
            ffmpeg_url: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
            ffmpeg_bin: ffmpeg
            artifact_suffix: linux-arm64
          - os: macos-13
            arch: amd64
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease
            ffmpeg_bin: ffmpeg
            artifact_suffix: macos-amd64
          - os: macos-14
            arch: arm64
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease
            ffmpeg_bin: ffmpeg
            artifact_suffix: macos-arm64
          - os: windows-latest
            arch: amd64
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            ffmpeg_bin: ffmpeg.exe
            artifact_suffix: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Download static ffmpeg (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          curl -L "${{ matrix.ffmpeg_url }}" -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cp ffmpeg-*-static/ffmpeg .
          chmod +x ffmpeg

      - name: Download static ffmpeg (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          curl -L "${{ matrix.ffmpeg_url }}" -o ffmpeg.7z
          7z x ffmpeg.7z -offmpeg_out || brew install ffmpeg && cp "$(which ffmpeg)" .
          test -f ffmpeg_out/ffmpeg && cp ffmpeg_out/ffmpeg . || true
          test -f ffmpeg && chmod +x ffmpeg || cp "$(which ffmpeg)" .
          chmod +x ffmpeg

      - name: Download static ffmpeg (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.ffmpeg_url }}" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_out
          $exe = Get-ChildItem -Recurse -Path ffmpeg_out -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe

      - name: Build CLI binary
        run: >
          pyinstaller --onefile --name ct-dlp
          --collect-all yt_dlp
          --add-binary "${{ matrix.ffmpeg_bin }}:."
          --strip
          ct_downloader.py

      - name: Build GUI binary
        run: >
          pyinstaller --onefile --windowed --name ct-gui
          --collect-all yt_dlp
          --hidden-import ct_downloader
          --add-data "ct_downloader.py:."
          --add-binary "${{ matrix.ffmpeg_bin }}:."
          --strip
          ct_gui.pyw

      - name: Smoke-test CLI binary (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          ./dist/ct-dlp --version
          ./dist/ct-dlp --help

      - name: Smoke-test CLI binary (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          .\dist\ct-dlp.exe --version
          .\dist\ct-dlp.exe --help

      - name: Rename artifacts with platform suffix (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          mv dist/ct-dlp "dist/ct-dlp-${{ matrix.artifact_suffix }}"
          mv dist/ct-gui "dist/ct-gui-${{ matrix.artifact_suffix }}"

      - name: Rename artifacts with platform suffix (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Move-Item dist\ct-dlp.exe "dist\ct-dlp-${{ matrix.artifact_suffix }}.exe"
          Move-Item dist\ct-gui.exe "dist\ct-gui-${{ matrix.artifact_suffix }}.exe"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-dlp-${{ matrix.artifact_suffix }}
          path: dist/ct-dlp-*

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-gui-${{ matrix.artifact_suffix }}
          path: dist/ct-gui-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
