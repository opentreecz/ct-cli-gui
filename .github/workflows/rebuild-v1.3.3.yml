name: Rebuild v1.3.3 binaries

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-v1.3.3.yml

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_suffix: linux-amd64
          - os: ubuntu-22.04-arm
            artifact_suffix: linux-arm64
          - os: macos-14
            artifact_suffix: macos-arm64
          - os: windows-latest
            artifact_suffix: windows-amd64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository at v1.3.3
        uses: actions/checkout@v7
        with:
          ref: v1.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Download static ffmpeg (Linux AMD64)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cp */bin/ffmpeg ./ffmpeg
          chmod +x ffmpeg

      - name: Download static ffmpeg (Linux ARM64)
        if: matrix.os == 'ubuntu-22.04-arm'
        run: |
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cp */bin/ffmpeg ./ffmpeg
          chmod +x ffmpeg

      - name: Get ffmpeg via Homebrew (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install --quiet ffmpeg
          cp "$(which ffmpeg)" ./ffmpeg
          chmod +x ffmpeg

      - name: Download static ffmpeg (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_out
          $exe = Get-ChildItem -Recurse -Path ffmpeg_out -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe

      - name: Set ffmpeg binary name
        id: ffmpeg
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            echo "bin=ffmpeg.exe" >> "$GITHUB_OUTPUT"
            echo "sep=;" >> "$GITHUB_OUTPUT"
          else
            echo "bin=ffmpeg" >> "$GITHUB_OUTPUT"
            echo "sep=:" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI binary
        shell: bash
        run: >
          pyinstaller --onefile --name ct-dlp
          --collect-all yt_dlp
          --add-binary "${{ steps.ffmpeg.outputs.bin }}${{ steps.ffmpeg.outputs.sep }}."
          ct_downloader.py

      - name: Build GUI binary
        shell: bash
        run: >
          pyinstaller --onefile --windowed --name ct-gui
          --collect-all yt_dlp
          --hidden-import ct_downloader
          --add-data "ct_downloader.py${{ steps.ffmpeg.outputs.sep }}."
          --add-binary "${{ steps.ffmpeg.outputs.bin }}${{ steps.ffmpeg.outputs.sep }}."
          ct_gui.pyw

      - name: Rename artifacts with platform suffix (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          mv dist/ct-dlp "dist/ct-dlp-${{ matrix.artifact_suffix }}"
          mv dist/ct-gui "dist/ct-gui-${{ matrix.artifact_suffix }}"

      - name: Rename artifacts with platform suffix (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          Move-Item dist\ct-dlp.exe "dist\ct-dlp-${{ matrix.artifact_suffix }}.exe"
          Move-Item dist\ct-gui.exe "dist\ct-gui-${{ matrix.artifact_suffix }}.exe"

      - name: Upload binaries for aggregation
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-${{ matrix.artifact_suffix }}
          path: dist/ct-*

  attach:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Attach to v1.3.3 release (overwrite)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v1.3.3
        run: |
          set -euo pipefail
          ls -la artifacts/

          release_json=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")

          release_id=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["id"])' <<<"$release_json")
          upload_url=$(python3 -c 'import json,sys; u=json.loads(sys.stdin.read())["upload_url"]; print(u.split("{",1)[0])' <<<"$release_json")

          existing_assets=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/releases/${release_id}/assets?per_page=100")

          for f in artifacts/*; do
            name=$(basename "$f")

            asset_id=$(TARGET="$name" python3 -c 'import json,sys,os; assets=json.loads(sys.stdin.read()); t=os.environ["TARGET"]; print(next((a.get("id") for a in assets if a.get("name")==t), ""))' <<<"$existing_assets")

            if [ -n "$asset_id" ]; then
              curl -sS -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/releases/assets/${asset_id}"
            fi

            curl -sS --fail-with-body \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "${upload_url}?name=${name}"
          done
