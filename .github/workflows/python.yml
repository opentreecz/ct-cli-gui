name: Python checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint Python
        run: ruff check .

      - name: Compile Python
        run: python -m compileall -q .
